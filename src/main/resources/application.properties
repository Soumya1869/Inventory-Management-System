# JPA properties
spring.jpa.database=MYSQL
spring.jpa.show-sql=false
# Non-destructive for local development. Set to validate after applying production schema migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Datasource properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wv}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JWT_SECRET must be Base64 for at least 64 random bytes (HS512).
app.jwt.secret=${JWT_SECRET}

# Server properties
server.port=8080
