# JPA properties
spring.jpa.database=MYSQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Flyway owns schema changes. Existing non-empty databases are baselined at V1,
# then Hibernate validates the mapped schema before the application starts.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Datasource properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wv}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JWT_SECRET must be Base64 for at least 64 random bytes (HS512).
app.jwt.secret=${JWT_SECRET}

# Server properties
server.port=8080
