# JPA properties
spring.jpa.database=MYSQL
spring.jpa.show-sql=false
# Non-destructive for local development. Use validate in production after applying migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Datasource properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wv}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:?Set DB_USER}
spring.datasource.password=${DB_PASSWORD:?Set DB_PASSWORD}

# JWT signing key. JWT_SECRET must be Base64 for at least 64 random bytes (HS512).
app.jwt.secret=${JWT_SECRET:?Set JWT_SECRET to a Base64 encoded 64-byte secret}

# Server properties
server.port=8080
